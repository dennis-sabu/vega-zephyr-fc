# prj.conf - Zephyr Project Configuration for VEGA ARIES v3 S500 Flight Controller
# Target: C-DAC THEJAS32 SoC (VEGA ET1031 RISC-V 32-bit @ 100 MHz)
# Total SRAM: 256 KB (Code/Data ~240 KB, Heap 8 KB, Thread Stacks ~12 KB)

# ------------------------------------------------------------------------------
# Architecture & Core Capabilities
# ------------------------------------------------------------------------------
CONFIG_RISCV=y
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# ------------------------------------------------------------------------------
# C Standard Library & Floating Point Formatter
# ------------------------------------------------------------------------------
CONFIG_NEWLIB_LIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ------------------------------------------------------------------------------
# RTOS Kernel & Memory Management
# ------------------------------------------------------------------------------
CONFIG_MULTITHREADING=y
CONFIG_PREEMPT_ENABLED=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_TIMING_FUNCTIONS=y

# Exact Memory Budgeting for 256 KB On-Chip SRAM Layout
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Data structures: static ring buffers for UART IRQ & Blackbox logging
CONFIG_RING_BUFFER=y

# ------------------------------------------------------------------------------
# Peripheral Subsystems
# ------------------------------------------------------------------------------
# I2C Subsystem (for MPU6050, BMP280, QMC5883L/HMC5883L on i2c0 @ 0x10000800)
CONFIG_I2C=y

# PWM Subsystem (for 400 Hz ESC signals on pwm0 @ 0x10400000)
CONFIG_PWM=y

# ADC Subsystem (for battery voltage monitoring on adc0 @ 0x10001000)
CONFIG_ADC=y

# UART Subsystem (UART0 for GNSS, UART1 for SBUS, UART2 for Telemetry)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# GPIO Subsystem (for SD Card SPI Chip-Select on GPIO1 Pin 10)
CONFIG_GPIO=y

# SPI Subsystem (SPI0 for MicroSD card @ 0x10000600)
CONFIG_SPI=y

# ------------------------------------------------------------------------------
# Disk Access & FatFS File System Subsystem (Phase 5 Blackbox Logging)
# ------------------------------------------------------------------------------
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_CODEPAGE=437
CONFIG_FS_FATFS_LFN=y

# SDHC SPI Driver & MMC Stack
CONFIG_SDHC=y
CONFIG_SDHC_SPI=y
CONFIG_MMC_STACK=y
CONFIG_SDMMC_STACK=y

# ------------------------------------------------------------------------------
# System Logging & Diagnostics
# ------------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_ASSERT=y
